<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1010" viewBox="0 0 720 1010" font-family="system-ui, Segoe UI, sans-serif">
  <title>Five pack-size badge designs, each for a program that needs a 32K pack</title>
  <rect width="720" height="1010" fill="#F6F7F3"/>
  <text x="24" y="38" font-size="22" font-weight="600" fill="#1A1F1C">Pack size badges: five ideas</text>
  <text x="24" y="62" font-size="14" fill="#56605A">Each drawn for a program that needs a 32K pack (8K to 256K, every power of 2)</text>

  <!-- 1. Datapak row -->
  <g transform="translate(24,84)">
    <rect width="672" height="160" rx="10" fill="#FFFFFF" stroke="#D5DAD2"/>
    <text x="16" y="28" font-size="16" font-weight="600" fill="#1A1F1C">1. Datapak row</text>
    <g transform="translate(16,44)" font-family="ui-monospace, Consolas, monospace" font-size="13">
      <g><rect x="0" y="0" width="64" height="72" rx="5" fill="none" stroke="#888780" stroke-dasharray="4 3"/><rect x="9" y="38" width="46" height="22" rx="2" fill="none" stroke="#888780"/><text x="32" y="54" text-anchor="middle" fill="#888780">8K</text></g>
      <g transform="translate(76)"><rect x="0" y="0" width="64" height="72" rx="5" fill="none" stroke="#888780" stroke-dasharray="4 3"/><rect x="9" y="38" width="46" height="22" rx="2" fill="none" stroke="#888780"/><text x="32" y="54" text-anchor="middle" fill="#888780">16K</text></g>
      <g transform="translate(152)"><rect x="0" y="0" width="64" height="72" rx="5" fill="#3A423D"/><rect x="9" y="38" width="46" height="22" rx="2" fill="#B4C0A6"/><text x="32" y="54" text-anchor="middle" fill="#1E2A33" font-weight="700">32K</text></g>
      <g transform="translate(228)"><rect x="0" y="0" width="64" height="72" rx="5" fill="#3A423D"/><rect x="9" y="38" width="46" height="22" rx="2" fill="#B4C0A6"/><text x="32" y="54" text-anchor="middle" fill="#1E2A33">64K</text></g>
      <g transform="translate(304)"><rect x="0" y="0" width="64" height="72" rx="5" fill="#3A423D"/><rect x="9" y="38" width="46" height="22" rx="2" fill="#B4C0A6"/><text x="32" y="54" text-anchor="middle" fill="#1E2A33">128K</text></g>
      <g transform="translate(380)"><rect x="0" y="0" width="64" height="72" rx="5" fill="#3A423D"/><rect x="9" y="38" width="46" height="22" rx="2" fill="#B4C0A6"/><text x="32" y="54" text-anchor="middle" fill="#1E2A33">256K</text></g>
    </g>
    <text x="16" y="146" font-size="13" fill="#56605A">Little pack shapes with LCD-green labels: solid ones fit, dashed ones are too small.</text>
  </g>

  <!-- 2. LCD capacity meter -->
  <g transform="translate(24,260)">
    <rect width="672" height="170" rx="10" fill="#FFFFFF" stroke="#D5DAD2"/>
    <text x="16" y="28" font-size="16" font-weight="600" fill="#1A1F1C">2. LCD capacity meter</text>
    <g transform="translate(16,42)" font-family="ui-monospace, Consolas, monospace">
      <rect width="384" height="90" rx="6" fill="#3A423D"/>
      <rect x="7" y="7" width="370" height="76" rx="3" fill="#B4C0A6"/>
      <text x="20" y="30" font-size="15" fill="#1E2A33">PACK  32K OR MORE</text>
      <g transform="translate(20,40)">
        <rect x="0" width="52" height="16" fill="none" stroke="#1E2A33"/>
        <rect x="58" width="52" height="16" fill="none" stroke="#1E2A33"/>
        <rect x="116" width="52" height="16" fill="#1E2A33"/>
        <rect x="174" width="52" height="16" fill="#1E2A33"/>
        <rect x="232" width="52" height="16" fill="#1E2A33"/>
        <rect x="290" width="52" height="16" fill="#1E2A33"/>
        <g font-size="11" fill="#1E2A33"><text x="0" y="30">8K</text><text x="58" y="30">16K</text><text x="116" y="30">32K</text><text x="174" y="30">64K</text><text x="232" y="30">128K</text><text x="290" y="30">256K</text></g>
      </g>
    </g>
    <text x="16" y="156" font-size="13" fill="#56605A">A recessed LCD like the screenshots, with a six-segment bar: lit segments are the packs that work.</text>
  </g>

  <!-- 3. Key-cap strip -->
  <g transform="translate(24,446)">
    <rect width="672" height="130" rx="10" fill="#FFFFFF" stroke="#D5DAD2"/>
    <text x="16" y="28" font-size="16" font-weight="600" fill="#1A1F1C">3. Key-cap strip</text>
    <g transform="translate(16,46)" font-family="ui-monospace, Consolas, monospace" font-size="14">
      <g><rect width="50" height="32" rx="5" fill="#FFFFFF" stroke="#888780"/><rect y="28" width="50" height="4" rx="2" fill="#888780"/><text x="25" y="21" text-anchor="middle" fill="#888780" text-decoration="line-through">8K</text></g>
      <g transform="translate(60)"><rect width="56" height="32" rx="5" fill="#FFFFFF" stroke="#888780"/><rect y="28" width="56" height="4" rx="2" fill="#888780"/><text x="28" y="21" text-anchor="middle" fill="#888780" text-decoration="line-through">16K</text></g>
      <g transform="translate(126)"><rect width="56" height="32" rx="5" fill="#1A1F1C"/><text x="28" y="21" text-anchor="middle" fill="#FFFFFF">32K</text></g>
      <g transform="translate(192)"><rect width="56" height="32" rx="5" fill="#1A1F1C"/><text x="28" y="21" text-anchor="middle" fill="#FFFFFF">64K</text></g>
      <g transform="translate(258)"><rect width="64" height="32" rx="5" fill="#1A1F1C"/><text x="32" y="21" text-anchor="middle" fill="#FFFFFF">128K</text></g>
      <g transform="translate(332)"><rect width="64" height="32" rx="5" fill="#1A1F1C"/><text x="32" y="21" text-anchor="middle" fill="#FFFFFF">256K</text></g>
      <g transform="translate(430)" font-size="12"><text x="0" y="12" fill="#56605A">pairs with the</text><text x="0" y="28" fill="#56605A">model strip</text></g>
    </g>
    <text x="16" y="114" font-size="13" fill="#56605A">The same keys as the CM / XP / LA / LZ / LZ64 strip: filled keys fit, struck-through ones don't.</text>
  </g>

  <!-- 4. Doubling blocks -->
  <g transform="translate(24,592)">
    <rect width="672" height="170" rx="10" fill="#FFFFFF" stroke="#D5DAD2"/>
    <text x="16" y="28" font-size="16" font-weight="600" fill="#1A1F1C">4. Doubling blocks</text>
    <g transform="translate(16,40)" font-family="ui-monospace, Consolas, monospace" font-size="12">
      <rect x="0" y="78" width="12" height="12" fill="none" stroke="#888780"/><text x="6" y="106" text-anchor="middle" fill="#888780">8K</text>
      <rect x="30" y="73" width="17" height="17" fill="none" stroke="#888780"/><text x="38" y="106" text-anchor="middle" fill="#888780">16K</text>
      <rect x="66" y="66" width="24" height="24" fill="#3A423D"/><rect x="63" y="63" width="30" height="30" fill="none" stroke="#6FCFB4" stroke-width="2"/><text x="78" y="106" text-anchor="middle" fill="#1A1F1C" font-weight="700">32K</text>
      <rect x="112" y="56" width="34" height="34" fill="#3A423D"/><text x="129" y="106" text-anchor="middle" fill="#56605A">64K</text>
      <rect x="168" y="42" width="48" height="48" fill="#3A423D"/><text x="192" y="106" text-anchor="middle" fill="#56605A">128K</text>
      <rect x="240" y="22" width="68" height="68" fill="#3A423D"/><text x="274" y="106" text-anchor="middle" fill="#56605A">256K</text>
      <text x="340" y="60" font-size="14" fill="#1A1F1C">needs 32K</text>
    </g>
    <text x="16" y="158" font-size="13" fill="#56605A">Each block's area doubles, so a 32K program looks as small as it is next to a 256K pack.</text>
  </g>

  <!-- 5. Pack label sticker -->
  <g transform="translate(24,778)">
    <rect width="672" height="140" rx="10" fill="#FFFFFF" stroke="#D5DAD2"/>
    <text x="16" y="28" font-size="16" font-weight="600" fill="#1A1F1C">5. Pack label sticker</text>
    <g transform="translate(16,44)" font-family="ui-monospace, Consolas, monospace">
      <rect width="190" height="50" rx="7" fill="#FFFFFF" stroke="#1A1F1C" stroke-width="2.5"/>
      <text x="16" y="35" font-size="26" font-weight="700" fill="#1A1F1C">32K</text>
      <text x="90" y="22" font-size="12" fill="#56605A">DATAPAK</text><text x="90" y="38" font-size="12" fill="#56605A">OR LARGER</text>
      <g transform="translate(216)">
        <rect width="200" height="50" rx="7" fill="none" stroke="#888780" stroke-width="2" stroke-dasharray="6 4"/>
        <text x="16" y="35" font-size="26" fill="#888780">256K</text>
        <text x="104" y="22" font-size="12" fill="#888780">FLASHPAK</text><text x="104" y="38" font-size="12" fill="#888780">ONLY</text>
      </g>
    </g>
    <text x="16" y="124" font-size="13" fill="#56605A">One bold label per program naming the pack; the dashed one shows how a 256K-only program would read.</text>
  </g>

  <text x="24" y="950" font-size="13" fill="#56605A">LCD colours as on the site: screen #B4C0A6, ink #1E2A33, bezel #3A423D.</text>
</svg>
